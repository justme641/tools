<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💃 舞蹈鏡像練習小工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
    .container { width: 100%; max-width: 800px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input[type="text"], input[type="file"] { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; width: 100%; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #3b82f6; color: white; transition: 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-mirror { background: #ec4899; }
    .btn-mirror:hover { background: #db2777; }
    .btn-active { background: #10b981 !important; } /* 用於標示開啟狀態 */
    
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    /* 鏡像翻轉核心 CSS (全螢幕時依然有效) */
    video.mirrored, iframe.mirrored {
      transform: scaleX(-1);
    }
    
    video, iframe { width: 100%; height: 100%; border: none; transition: transform 0.3s ease; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 15px; }
    .control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select { padding: 8px; border-radius: 6px; background: #2a2a2a; color: white; border: 1px solid #333; }
  </style>
</head>
<body>

  <h1>💃 舞蹈鏡像播放器 (Dance Mirror)</h1>

  <div class="container">
    <div class="input-group">
      <input type="file" id="localVideo" accept="video/*">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="ytUrl" placeholder="貼上 YouTube 影片網址...">
        <button class="btn" onclick="loadYouTube()">載入 YT</button>
      </div>
    </div>

    <!-- 影片包覆容器，全螢幕會針對這裡放大 -->
    <div class="video-wrapper" id="videoWrapper">
      <video id="myVideo" controls style="display:none;"></video>
      <iframe id="ytPlayer" style="display:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div id="placeholder" style="color: #888;">請選擇本地影片或輸入 YouTube 網址</div>
    </div>

    <div class="controls">
      <div class="control-row">
        <button class="btn btn-mirror" onclick="toggleMirror()">🪞 鏡像翻轉 (Off)</button>
        <button class="btn" id="loopBtn" onclick="toggleLoop()">🔁 循環播放 (Off)</button>
        <button class="btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
      </div>
      
      <div class="control-row">
        <label>播放速度：</label>
        <select id="speedSelect" onchange="changeSpeed(this.value)">
          <option value="0.5">0.5x (慢速)</option>
          <option value="0.75">0.75x (稍慢)</option>
          <option value="1" selected>1.0x (原速)</option>
          <option value="1.25">1.25x (快速)</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const ytPlayer = document.getElementById('ytPlayer');
    const placeholder = document.getElementById('placeholder');
    const videoWrapper = document.getElementById('videoWrapper');
    let isMirrored = false;
    let isLooped = false;
    let currentType = null; // 'local' or 'yt'

    // 本地影片載入
    document.getElementById('localVideo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'block';
        ytPlayer.style.display = 'none';
        placeholder.style.display = 'none';
        currentType = 'local';
        video.play();
      }
    });

    // YouTube 載入
    function loadYouTube() {
      const urlInput = document.getElementById('ytUrl').value;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlInput.match(regExp);

      if (match && match[2].length === 11) {
        const videoId = match[2];
        // 加上 loop=1 與 playlist 參數支援 YouTube 循環
        let ytSrc = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
        if (isLooped) {
          ytSrc += `&loop=1&playlist=${videoId}`;
        }
        ytPlayer.src = ytSrc;
        ytPlayer.style.display = 'block';
        video.style.display = 'none';
        placeholder.style.display = 'none';
        currentType = 'yt';
      } else {
        alert('請輸入正確的 YouTube 影片網址！');
      }
    }

    // 鏡像切換
    function toggleMirror() {
      isMirrored = !isMirrored;
      const btn = document.querySelector('.btn-mirror');
      if (isMirrored) {
        video.classList.add('mirrored');
        ytPlayer.classList.add('mirrored');
        btn.classList.add('btn-active');
        btn.textContent = '🪞 鏡像翻轉 (On)';
      } else {
        video.classList.remove('mirrored');
        ytPlayer.classList.remove('mirrored');
        btn.classList.remove('btn-active');
        btn.textContent = '🪞 鏡像翻轉 (Off)';
      }
    }

    // 循環播放切換
    function toggleLoop() {
      isLooped = !isLooped;
      const btn = document.getElementById('loopBtn');
      if (isLooped) {
        video.loop = true;
        btn.classList.add('btn-active');
        btn.textContent = '🔁 循環播放 (On)';
      } else {
        video.loop = false;
        btn.classList.remove('btn-active');
        btn.textContent = '🔁 循環播放 (Off)';
      }
      // 如果當前是 YouTube，重新載入以套用循環設定
      if (currentType === 'yt') {
        loadYouTube();
      }
    }

    // 全螢幕功能（維持鏡像關鍵：對整個外框 wrapper 進行全螢幕）
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (videoWrapper.requestFullscreen) {
          videoWrapper.requestFullscreen();
        } else if (videoWrapper.webkitRequestFullscreen) {
          videoWrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 速度調整
    function changeSpeed(speed) {
      if (currentType === 'local') {
        video.playbackRate = parseFloat(speed);
      } else if (currentType === 'yt') {
        alert('YouTube 嵌入影片速度需由播放器右下角齒輪手動調整喔！');
      }
    }
  </script>
</body>
</html>
