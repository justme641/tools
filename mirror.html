<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💃 舞蹈鏡像練習與影音播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; color: #ffffff; }
    .container { width: 100%; max-width: 800px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input[type="text"], input[type="file"] { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; width: 100%; }
    
    .btn { padding: 10px 16px; border: 1px solid #3b82f6; border-radius: 6px; font-weight: bold; cursor: pointer; background: #2563eb; color: white; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #374151; border-color: #4b5563; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-download { background: #059669; border-color: #047857; }
    .btn-download:hover { background: #047857; }
    .btn-active { background: #10b981 !important; border-color: #059669 !important; }

    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    video.mirrored, iframe.mirrored {
      transform: scaleX(-1);
    }
    
    video, iframe { width: 100%; height: 100%; border: none; transition: transform 0.3s ease; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 15px; }
    .control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select { padding: 8px; border-radius: 6px; background: #2a2a2a; color: white; border: 1px solid #333; }

    /* 版本歷程樣式 */
    .changelog-section { margin-top: 30px; width: 100%; max-width: 800px; background: #181818; padding: 15px 20px; border-radius: 8px; border: 1px solid #282828; }
    .changelog-title { font-size: 0.95rem; font-weight: bold; color: #9ca3af; margin-bottom: 8px; }
    .changelog-item { font-size: 0.85rem; color: #6b7280; line-height: 1.5; }
    .changelog-item ul { margin-left: 20px; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>💃 舞蹈鏡像練習與影音播放器</h1>

  <div class="container">
    <div class="input-group">
      <label style="font-size: 0.85rem; color: #aaa;">選擇本地影片或 MP3 音訊檔：</label>
      <input type="file" id="localVideo" accept="video/*,audio/*">
      
      <label style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">貼上 YouTube 影片網址：</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button class="btn" onclick="loadYouTube()">載入 YT 播放</button>
      </div>
      
      <!-- 呼叫 Seal / 桌機提示按鈕 -->
      <div style="display: flex; gap: 8px; margin-top: 5px;">
        <button class="btn btn-download" style="font-size: 0.85rem; width: 100%;" onclick="openSealOrWarn()">📱 複製網址並開啟 Seal 下載</button>
      </div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
      <video id="myVideo" controls style="display:none;"></video>
      <iframe id="ytPlayer" style="display:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div id="placeholder" style="color: #888;">請選擇本地影音檔或載入 YouTube 網址</div>
    </div>

    <div class="controls">
      <div class="control-row">
        <button class="btn btn-secondary" id="mirrorBtn" onclick="toggleMirror()">🪞 鏡像翻轉 (Off)</button>
        <button class="btn btn-secondary" id="loopBtn" onclick="toggleLoop()">🔁 循環播放 (Off)</button>
        <button class="btn btn-secondary" onclick="toggleFullscreen()">⛶ 全螢幕</button>
      </div>
      
      <div class="control-row">
        <label style="font-size: 0.9rem;">播放速度：</label>
        <select id="speedSelect" onchange="changeSpeed(this.value)">
          <option value="0.5">0.5x (慢速)</option>
          <option value="0.75">0.75x (稍慢)</option>
          <option value="1" selected>1.0x (原速)</option>
          <option value="1.25">1.25x (快速)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 修改歷程說明 -->
  <div class="changelog-section">
    <div class="changelog-title">📜 修改歷程紀錄 (Changelog)</div>
    <div class="changelog-item">
      <strong>v1.2 (2026-10-23)</strong>
      <ul>
        <li>下載按鈕優化：改為點擊後自動複製 YT 網址並嘗試呼叫手機 Seal App；若在桌機或未安裝則自動彈出提示請至手機上操作。</li>
      </ul>
      <strong style="display:inline-block; margin-top:6px;">v1.1 (2026-10-23)</strong>
      <ul>
        <li>介面優化：整合無廣告、極簡的 YouTube 影音取得通道按鈕。</li>
      </ul>
      <strong style="display:inline-block; margin-top:6px;">v1.0 (2026-10-23)</strong>
      <ul>
        <li>創立專案：實現本地影音與 YouTube 嵌入鏡像播放器、全螢幕、循環播放及速度調節。</li>
      </ul>
    </div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const ytPlayer = document.getElementById('ytPlayer');
    const placeholder = document.getElementById('placeholder');
    const videoWrapper = document.getElementById('videoWrapper');
    let isMirrored = false;
    let isLooped = false;
    let currentType = null;

    // 本地影音載入
    document.getElementById('localVideo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'block';
        ytPlayer.style.display = 'none';
        placeholder.style.display = 'none';
        currentType = 'local';
        video.play();
      }
    });

    // YouTube 載入
    function loadYouTube() {
      const urlInput = document.getElementById('ytUrl').value;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlInput.match(regExp);

      if (match && match[2].length === 11) {
        const videoId = match[2];
        let ytSrc = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
        if (isLooped) {
          ytSrc += `&loop=1&playlist=${videoId}`;
        }
        ytPlayer.src = ytSrc;
        ytPlayer.style.display = 'block';
        video.style.display = 'none';
        placeholder.style.display = 'none';
        currentType = 'yt';
      } else {
        alert('請輸入正確的 YouTube 影片網址！');
      }
    }

    // 智慧判斷：複製網址並嘗試開 Seal，桌機則給予提示
    function openSealOrWarn() {
      const urlInput = document.getElementById('ytUrl').value;
      if (!urlInput) {
        alert('請先在上方輸入框貼上 YouTube 網址！');
        return;
      }

      // 檢查是否為手機裝置 (簡單判斷 UA)
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      // 1. 自動複製網址到剪貼簿
      navigator.clipboard.writeText(urlInput).then(() => {
        if (isMobile) {
          // 嘗試呼叫 Seal App (透過 intent 或是直接喚醒)
          alert('網址已自動複製！即將為您嘗試開啟 Seal App（若未自動跳轉，請手動開啟 Seal 並直接貼上）');
          window.location.href = `intent://${urlInput}#Intent;package=com.junkfood.seal;end;`;
        } else {
          // 桌機端提示
          alert('【桌機提示】\n網址已複製到剪貼簿！由於桌機無法直接使用 Seal App 下載，請改至手機上開啟此網頁並使用 Seal App 進行下載喔！');
        }
      }).catch(err => {
        alert('複製網址失敗，請手動複製。');
      });
    }

    // 鏡像切換
    function toggleMirror() {
      isMirrored = !isMirrored;
      const btn = document.getElementById('mirrorBtn');
      if (isMirrored) {
        video.classList.add('mirrored');
        ytPlayer.classList.add('mirrored');
        btn.classList.add('btn-active');
        btn.textContent = '🪞 鏡像翻轉 (On)';
      } else {
        video.classList.remove('mirrored');
        ytPlayer.classList.remove('mirrored');
        btn.classList.remove('btn-active');
        btn.textContent = '🪞 鏡像翻轉 (Off)';
      }
    }

    // 循環播放切換
    function toggleLoop() {
      isLooped = !isLooped;
      const btn = document.getElementById('loopBtn');
      if (isLooped) {
        video.loop = true;
        btn.classList.add('btn-active');
        btn.textContent = '🔁 循環播放 (On)';
      } else {
        video.loop = false;
        btn.classList.remove('btn-active');
        btn.textContent = '🔁 循環播放 (Off)';
      }
      if (currentType === 'yt') {
        loadYouTube();
      }
    }

    // 全螢幕
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (videoWrapper.requestFullscreen) {
          videoWrapper.requestFullscreen();
        } else if (videoWrapper.webkitRequestFullscreen) {
          videoWrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 速度調整
    function changeSpeed(speed) {
      if (currentType === 'local') {
        video.playbackRate = parseFloat(speed);
      } else if (currentType === 'yt') {
        alert('YouTube 嵌入影片速度需由播放器右下角 ⚙️ 齒輪手動調整喔！');
      }
    }
  </script>
</body>
</html>
